services:
  postgres:
    image: postgres:16-alpine
    container_name: industrial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-industrial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-industrial}
      POSTGRES_DB: ${POSTGRES_DB:-industrial}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-industrial} -d ${POSTGRES_DB:-industrial}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend/node-api
    container_name: industrial-backend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-industrial}:${POSTGRES_PASSWORD:-industrial}@postgres:5432/${POSTGRES_DB:-industrial}
      NOMINAL_CAPACITY_PER_HOUR: ${NOMINAL_CAPACITY_PER_HOUR:-400}
      ALERT_FILL_PERCENT_MIN: ${ALERT_FILL_PERCENT_MIN:-0}
      ALERT_FILL_PERCENT_MAX: ${ALERT_FILL_PERCENT_MAX:-100}
      ALERT_STOPPED_MS: ${ALERT_STOPPED_MS:-60000}
      PLANT_TIMEZONE: ${PLANT_TIMEZONE:-America/Sao_Paulo}
      SHIFT_START_HOUR: ${SHIFT_START_HOUR:-6}
      SHIFT_HOURS: ${SHIFT_HOURS:-8}
      DASHBOARD_DIR: /app/dashboard/frontend
      SYSTEM_CONTROL_TOKEN: ${SYSTEM_CONTROL_TOKEN:-pi40-local-control}
      SYSTEM_CONTROL_COMMAND_PATH: ${SYSTEM_CONTROL_COMMAND_PATH:-/app/runtime/system-command.json}
      SYSTEM_CONTROL_ORIGIN: ${SYSTEM_CONTROL_ORIGIN:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./dashboard/frontend:/app/dashboard/frontend:ro
      - ./runtime:/app/runtime
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  simulator:
    image: node:22-alpine
    container_name: industrial-simulator
    restart: unless-stopped
    working_dir: /app
    command: ["node", "simulator/plc-simulator.js"]
    environment:
      BACKEND_URL: http://backend:3000
      MACHINE_ID: ${MACHINE_ID:-Linha-01}
      TICK_MS: ${SIMULATOR_TICK_MS:-100}
      PUBLISH_MS: ${SIMULATOR_PUBLISH_MS:-1000}
      AUTO_START: ${SIMULATOR_AUTO_START:-true}
    volumes:
      - ./simulator:/app/simulator:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
